name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amber_test
          POSTGRES_PASSWORD: amber_test_local_only
          POSTGRES_DB: amber_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U amber_test -d amber_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://amber_test:amber_test_local_only@127.0.0.1:55432/amber_test
      NBU_RATE_OVERRIDE: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Validate Compose configuration
        env:
          OIDC_CLIENT_SECRET: compose-validation-only
          SESSION_SECRET: compose-validation-only-0123456789abcdef
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Server dependencies
        run: npm ci
        working-directory: server
      - name: Server static checks
        run: npm run lint
        working-directory: server
      - name: Server unit tests
        run: npm test
        working-directory: server
      - name: Server unit coverage
        run: npm run test:coverage
        working-directory: server
      - name: PostgreSQL integration tests
        run: npm run test:integration
        working-directory: server
      - name: Client dependencies
        run: npm ci
        working-directory: client
      - name: Client tests
        run: npm test
        working-directory: client
      - name: Client coverage
        run: npm run test:coverage
        working-directory: client
      - name: Client lint
        run: npm run lint
        working-directory: client
      - name: Production build
        run: npm run build
        working-directory: client
