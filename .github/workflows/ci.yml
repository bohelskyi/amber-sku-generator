name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amber
          POSTGRES_PASSWORD: amber_password
          POSTGRES_DB: amber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amber -d amber_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://amber:amber_password@127.0.0.1:5432/amber_test
      NBU_RATE_OVERRIDE: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server dependencies
        run: npm ci
        working-directory: server
      - name: Server unit tests
        run: npm test
        working-directory: server
      - name: PostgreSQL integration tests
        run: npm run test:integration
        working-directory: server
      - name: Client dependencies
        run: npm ci
        working-directory: client
      - name: Client tests
        run: npm test
        working-directory: client
      - name: Client lint
        run: npm run lint
        working-directory: client
      - name: Production build
        run: npm run build
        working-directory: client
