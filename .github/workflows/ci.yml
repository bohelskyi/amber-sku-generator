name: CI

# Pull requests run once (pull_request); main runs after merge. Feature-branch pushes
# without a PR are not duplicated.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      NBU_RATE_OVERRIDE: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Validate Compose configuration
        env:
          OIDC_CLIENT_SECRET: compose-validation-only
          SESSION_SECRET: compose-validation-only-0123456789abcdef
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Server dependencies
        run: npm ci
        working-directory: server
      - name: Server static checks
        run: npm run lint
        working-directory: server
      # The coverage run executes the complete unit suite once and fails on any failing test.
      - name: Server unit tests with coverage
        run: npm run test:coverage
        working-directory: server

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amber_test
          POSTGRES_PASSWORD: amber_test_local_only
          POSTGRES_DB: amber_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U amber_test -d amber_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://amber_test:amber_test_local_only@127.0.0.1:55432/amber_test
      NBU_RATE_OVERRIDE: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Server dependencies
        run: npm ci
        working-directory: server
      - name: PostgreSQL integration tests
        run: npm run test:integration
        working-directory: server
      - name: Remove integration template database
        if: always()
        run: node integration-test/harness.js cleanup-template
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client dependencies
        run: npm ci
        working-directory: client
      # The coverage run executes the complete client suite once and fails on any failing test.
      - name: Client tests with coverage
        run: npm run test:coverage
        working-directory: client
      - name: Client lint
        run: npm run lint
        working-directory: client
      - name: Production build
        run: npm run build
        working-directory: client

  # Single aggregate status under the historical check name.
  test:
    if: always()
    needs: [server, integration, client]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          test "${{ needs.server.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.client.result }}" = success
