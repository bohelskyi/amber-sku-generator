map $http_x_forwarded_proto $amber_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $uri $amber_logged_request {
  default $request;
  ~^/api/auth/callback(?:/|$) "$request_method $uri $server_protocol";
}

map $uri $amber_logged_referer {
  default $http_referer;
  ~^/api/auth/callback(?:/|$) "-";
}

log_format amber_access '$remote_addr - $remote_user [$time_local] "$amber_logged_request" '
                        '$status $body_bytes_sent "$amber_logged_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 5s;
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log amber_access;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $amber_api_upstream "${SERVER_HOST}:${SERVER_PORT}";
    proxy_pass http://$amber_api_upstream$request_uri;
    proxy_redirect http://${SERVER_HOST}:${SERVER_PORT}/api/ /api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $amber_forwarded_proto;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location / {
    try_files $uri /index.html;
  }
}
