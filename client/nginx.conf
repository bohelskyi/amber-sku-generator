map $http_x_forwarded_proto $amber_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $uri $amber_logged_request {
  default $request;
  ~^/api/auth/callback(?:/|$) "$request_method $uri $server_protocol";
}

map $uri $amber_logged_referer {
  default $http_referer;
  ~^/api/auth/callback(?:/|$) "-";
}

log_format amber_access '$remote_addr - $remote_user [$time_local] "$amber_logged_request" '
                        '$status $body_bytes_sent "$amber_logged_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log amber_access;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://${SERVER_HOST}:${SERVER_PORT}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $amber_forwarded_proto;
  }

  location / {
    try_files $uri /index.html;
  }
}
